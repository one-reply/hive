name: Bug report
description: Report a reproducible problem in Hive
body:
  - type: markdown
    attributes:
      value: "For security issues use private vulnerability reporting. Do not attach keys, tokens, private code, or unredacted logs."
  - type: input
    id: version
    attributes:
      label: Hive version or commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Apple Silicon model
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a small example repository without private information when possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted logs or screenshots
