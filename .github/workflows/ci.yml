name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      verify_release:
        description: Sign and verify the main build without publishing a release
        type: boolean
        default: false
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  security:
    name: Security and licenses
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified audit tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/install-release-tools.py "$RUNNER_TEMP/hive-tools"
          echo "$RUNNER_TEMP/hive-tools" >> "$GITHUB_PATH"
      - name: Scan history and current files
        run: |
          gitleaks git --log-opts='--all' --redact=100 --max-archive-depth=3 --max-decode-depth=2
          gitleaks dir . --redact=100 --max-archive-depth=3 --max-decode-depth=2
      - name: Check dependencies
        run: cargo deny --locked check licenses advisories sources

  remote:
    name: Linux helper (${{ matrix.architecture }})
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install toolchain and musl
        run: |
          rustup target add "${{ matrix.target }}"
          # Use signed Ubuntu repositories directly over HTTPS instead of the runner's HTTP mirrors.
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://ports\.ubuntu\.com/ubuntu-ports|https://ports.ubuntu.com/ubuntu-ports|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check and test shared filesystem on Linux
        run: |
          cargo clippy --locked -p hive-core --no-default-features --features remote-helper --all-targets -- -D warnings
          cargo test --locked -p hive-core --no-default-features --features remote-helper
      - name: Build static helper
        env:
          CC: musl-gcc
        run: cargo build --locked -p hive-core --no-default-features --features remote-helper --bin hive-remote --release --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hive-remote-${{ matrix.architecture }}
          path: target/${{ matrix.target }}/release/hive-remote
          if-no-files-found: error
          retention-days: 7

  build:
    name: macOS checks and bundle
    needs: remote
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Core must not depend on GPUI
        run: |
          cargo tree --locked -p hive-core > "$RUNNER_TEMP/core-tree.txt"
          if grep -i gpui "$RUNNER_TEMP/core-tree.txt"; then
            echo 'hive-core must not depend on GPUI' >&2
            exit 1
          fi
      - name: Read version and verify release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "hive"))')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$RELEASE_TAG" = "v$version"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Install verified release tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/install-release-tools.py "$RUNNER_TEMP/hive-tools"
          echo "$RUNNER_TEMP/hive-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: hive-remote-*
          path: target/remote-builds
      - name: Package Linux helpers
        run: python3 scripts/package-remote.py --x86_64 target/remote-builds/hive-remote-x86_64/hive-remote --aarch64 target/remote-builds/hive-remote-aarch64/hive-remote
      - name: Build and validate ARM64 app and archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/install-sparkle.py target/sparkle
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash scripts/bundle-macos.sh release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hive-macos-arm64
          path: |
            target/release/bundle/Hive-*-macos-arm64.zip
            target/release/bundle/Hive-*-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign and publish release
    if: >-
      (startsWith(github.ref, 'refs/tags/') && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.verify_release)
    needs: [security, build]
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hive-macos-arm64
          path: release
      - name: Sign with Developer ID and notarize with Apple
        env:
          HIVE_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          HIVE_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          HIVE_APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${HIVE_APPLE_TEAM_ID:?Configure APPLE_TEAM_ID before creating a release tag}"
          : "${APPLE_API_KEY_BASE64:?Missing App Store Connect API key}"
          : "${HIVE_APPLE_API_KEY_ID:?Missing API key ID}"
          : "${HIVE_APPLE_API_ISSUER_ID:?Missing API issuer ID}"
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/hive-signing.XXXXXX")"
          export HIVE_APPLE_API_KEY="$signing_dir/AuthKey.p8"
          trap 'rm -f "$HIVE_APPLE_API_KEY"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$HIVE_APPLE_API_KEY"
          openssl pkey -in "$HIVE_APPLE_API_KEY" -check -noout
          archive="Hive-${RELEASE_TAG#v}-macos-arm64.zip"
          (cd release && shasum -a 256 -c "$archive.sha256")
          ditto -x -k "release/$archive" "$signing_dir/app"
          python3 scripts/sign_macos.py "$signing_dir/app/Hive.app"
          ditto -c -k --sequesterRsrc --keepParent "$signing_dir/app/Hive.app" "$signing_dir/$archive"
          unzip -tq "$signing_dir/$archive"
          mv "$signing_dir/$archive" "release/$archive"
          (cd release && shasum -a 256 "$archive" > "$archive.sha256" && shasum -a 256 -c "$archive.sha256")
      - name: Install verified Sparkle tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/install-sparkle.py target/sparkle
      - name: Sign update archive and feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | target/sparkle/bin/generate_appcast \
            --ed-key-file - --maximum-deltas 0 \
            --download-url-prefix "https://github.com/$RELEASE_REPOSITORY/releases/download/$RELEASE_TAG/" \
            --link "https://github.com/$RELEASE_REPOSITORY/releases/tag/$RELEASE_TAG" release
          test -s release/appcast.xml
      - name: Verify assets and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          HIVE_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=()
          if [[ "$VERIFY_ONLY" == true ]]; then args+=(--verify-only); fi
          python3 scripts/publish_release.py "$RELEASE_REPOSITORY" "$RELEASE_TAG" release "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hive-signed-macos-arm64
          path: release/*
          if-no-files-found: error
          retention-days: 7
