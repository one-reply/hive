name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  security:
    name: Security and licenses
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified audit tools
        run: |
          python3 scripts/install-release-tools.py "$RUNNER_TEMP/hive-tools"
          echo "$RUNNER_TEMP/hive-tools" >> "$GITHUB_PATH"
      - name: Scan history and current files
        run: |
          gitleaks git --log-opts='--all' --redact=100 --max-archive-depth=3 --max-decode-depth=2
          gitleaks dir . --redact=100 --max-archive-depth=3 --max-decode-depth=2
      - name: Check dependencies
        run: cargo deny --locked check licenses advisories sources

  build:
    name: macOS checks and bundle
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Core must not depend on GPUI
        run: |
          cargo tree --locked -p hive-core > "$RUNNER_TEMP/core-tree.txt"
          if grep -i gpui "$RUNNER_TEMP/core-tree.txt"; then
            echo 'hive-core must not depend on GPUI' >&2
            exit 1
          fi
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "hive"))')"
          test "$RELEASE_TAG" = "v$version"
      - name: Install verified release tools
        run: |
          python3 scripts/install-release-tools.py "$RUNNER_TEMP/hive-tools"
          echo "$RUNNER_TEMP/hive-tools" >> "$GITHUB_PATH"
      - name: Build and validate ARM64 app and archive
        run: |
          python3 scripts/install-sparkle.py target/sparkle
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash scripts/bundle-macos.sh release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hive-macos-arm64
          path: |
            target/release/bundle/Hive-*-macos-arm64.zip
            target/release/bundle/Hive-*-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft prerelease
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: [security, build]
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hive-macos-arm64
          path: release
      - name: Sign with Developer ID and notarize with Apple
        env:
          HIVE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          : "${HIVE_SIGNING_IDENTITY:?Configure APPLE_SIGNING_IDENTITY before creating a release tag}"
          : "${DEVELOPER_ID_CERTIFICATE_BASE64:?Missing Developer ID certificate}"
          : "${DEVELOPER_ID_CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${NOTARY_API_KEY_BASE64:?Missing Notary API key}"
          : "${NOTARY_KEY_ID:?Missing Notary key ID}"
          : "${NOTARY_ISSUER_ID:?Missing Notary issuer ID}"
          signing_dir="$(mktemp -d "$RUNNER_TEMP/hive-signing.XXXXXX")"
          keychain="$signing_dir/signing.keychain-db"
          cleanup() {
            if [[ -f "$keychain" ]]; then
              security delete-keychain "$keychain" || echo '::warning::Could not delete temporary signing keychain'
            fi
            rm -f "$signing_dir/certificate.p12" "$signing_dir/notary.p8"
          }
          trap cleanup EXIT
          umask 077
          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$signing_dir/certificate.p12"
          printf '%s' "$NOTARY_API_KEY_BASE64" | base64 --decode > "$signing_dir/notary.p8"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/certificate.p12" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -k "$keychain" -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials hive-notary --key "$signing_dir/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain"
          export HIVE_SIGNING_KEYCHAIN="$keychain" HIVE_NOTARY_PROFILE=hive-notary
          archive="Hive-${RELEASE_TAG#v}-macos-arm64.zip"
          (cd release && shasum -a 256 -c "$archive.sha256")
          ditto -x -k "release/$archive" "$signing_dir/app"
          python3 scripts/sign_macos.py "$signing_dir/app/Hive.app"
          ditto -c -k --sequesterRsrc --keepParent "$signing_dir/app/Hive.app" "$signing_dir/$archive"
          unzip -tq "$signing_dir/$archive"
          mv "$signing_dir/$archive" "release/$archive"
          (cd release && shasum -a 256 "$archive" > "$archive.sha256" && shasum -a 256 -c "$archive.sha256")
      - name: Install verified Sparkle tools
        run: python3 scripts/install-sparkle.py target/sparkle
      - name: Sign update archive and feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | target/sparkle/bin/generate_appcast \
            --ed-key-file - --maximum-deltas 0 \
            --download-url-prefix "https://github.com/$RELEASE_REPOSITORY/releases/download/$RELEASE_TAG/" \
            --link "https://github.com/$RELEASE_REPOSITORY/releases/tag/$RELEASE_TAG" release
          test -s release/appcast.xml
      - name: Create draft for manual installation checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease \
            --title "Hive $RELEASE_TAG — early preview" --generate-notes
