[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
hive-core = { path = "crates/hive-core" }

gpui-kit = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
security-framework = { version = "3.7", default-features = false }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
alacritty_terminal = "0.26"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
async-channel = "2.5"
polling = "3.11"
rustix = { version = "1.1", default-features = false, features = ["std", "process", "termios"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
