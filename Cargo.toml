[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/one-reply/hive"
publish = false

[workspace.dependencies]
hive-core = { path = "crates/hive-core" }

gpui-kit = { version = "0.9", features = ["tree-sitter-languages"] }
# Test-only: the GPUI gpui-kit pins, for `test-support` (TestAppContext, `#[gpui::test]`).
# gpui-kit's own `test-support` names gpui-fast weakly, which still enters resolution and
# conflicts on taffy, so the feature is turned on here directly.
gpui-pre = "=0.3.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
ureq = "3"
security-framework = { version = "3.7", default-features = false }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
alacritty_terminal = "0.26"
rustix-openpty = "0.2"
libc = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "gif", "bmp", "ico"] }
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "raster-images"] }
async-channel = "2.5"
polling = "3.11"
rustix = { version = "1.1", default-features = false, features = ["std", "process", "termios", "fs"] }
tracing = "0.1"
# Parsers already built by gpui-kit's highlighter; reused by hive-core import navigation.
tree-sitter = "0.26"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
# Same version gpui-component uses for its DefinitionProvider contract.
lsp-types = "0.97"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSError", "NSString"] }
