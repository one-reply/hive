[package]
name = "hive"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hive-core.workspace = true
image.workspace = true
async-channel.workspace = true
gpui-kit.workspace = true
lsp-types.workspace = true
tree-sitter.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-user-notifications.workspace = true
objc2-avf-audio.workspace = true
objc2-av-foundation.workspace = true
block2.workspace = true

[dev-dependencies]
# Feed captured TUI output into the terminal grid in window tests.
alacritty_terminal.workspace = true
# The one Git environment of every test that runs `git` (`hive_core::git::testing`).
hive-core = { workspace = true, features = ["test-support"] }
# Window tests (`#[gpui::test]`, simulated keystrokes) for editor key handling.
gpui-pre = { workspace = true, features = ["test-support"] }
