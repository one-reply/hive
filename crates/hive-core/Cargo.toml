[package]
name = "hive-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:alacritty_terminal", "dep:rustix-openpty", "dep:polling", "dep:ureq", "dep:async-channel", "dep:security-framework", "dep:markdown", "dep:similar", "dep:tree-sitter-json", "dep:node-semver", "dep:serde-saphyr", "dep:serde_json_lenient", "dep:yarn-lock-parser", "dep:globset"]
remote-helper = []
# Exposes `git::testing`, the hermetic Git environment, to the tests of other crates. It adds
# functions only: nothing behaves differently until a test calls them.
test-support = []

[[bin]]
name = "hive-remote"
required-features = ["remote-helper"]

# No GPUI here, ever. This crate is the domain + CLI/HTTP adapters and doubles as the
# wire/proto types for a future backend.

[dependencies]
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
similar = { workspace = true, optional = true }
sha2.workspace = true
lsp-types.workspace = true
markdown = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
base64.workspace = true
chrono.workspace = true
thiserror.workspace = true
alacritty_terminal = { workspace = true, optional = true }
rustix-openpty = { workspace = true, optional = true }
libc.workspace = true
image.workspace = true
resvg.workspace = true
async-channel = { workspace = true, optional = true }
polling = { workspace = true, optional = true }
rustix.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
globset = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
node-semver = { workspace = true, optional = true }
serde-saphyr = { workspace = true, optional = true }
yarn-lock-parser = { workspace = true, optional = true }
serde_json_lenient = { workspace = true, optional = true }

tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
regex.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber.workspace = true
